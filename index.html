<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Kana Flash - Practice JP Kana</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const theme = localStorage.getItem("kana-theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.17/dist/motion.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Kana Flashcards</h1>
      <button id="themeToggle" type="button"></button>
    </header>

    <section id="setup-section">
      <h2>1. Select Characters <span id="selected-count" class="h2-meta"></span></h2>
      <div id="select-controls">
        <div>
          <label
            ><input type="checkbox" id="cb-hiragana" class="cb-kanaselect" />
            Hiragana</label
          >
          &nbsp;
          <label
            ><input type="checkbox" id="cb-katakana" class="cb-kanaselect" />
            Katakana</label
          >
        </div>
        <div>
          <label
            ><input type="checkbox" id="cb-combo" class="cb-kanaselect" />
            Include combo</label
          >
          &nbsp;
          <label
            ><input type="checkbox" id="cb-dakuten" class="cb-kanaselect" />
            Include dakuten/han-dakuten</label
          >
        </div>
      </div>

      <div id="kana-grid">
        <div>
          <div class="kana-section-label">Hiragana</div>
          <div id="hiragana-groups"></div>
        </div>
        <div>
          <div class="kana-section-label">Katakana</div>
          <div id="katakana-groups"></div>
        </div>
        <div>
          <div class="kana-section-label">Hiragana — combo</div>
          <div id="hiragana-combo-groups"></div>
        </div>
        <div>
          <div class="kana-section-label">Katakana — combo</div>
          <div id="katakana-combo-groups"></div>
        </div>
      </div>
    </section>

    <section>
      <h2>2. Direction</h2>
      <div class="controls">
        <label
          ><input type="radio" name="dir" value="jp2en" checked /> Japanese →
          Romaji</label
        >
        <label
          ><input type="radio" name="dir" value="en2jp" /> Romaji →
          Japanese</label
        >
        <label><input type="radio" name="dir" value="mixed" /> Mixed</label>
      </div>
      <label class="option-row"
        ><input type="checkbox" id="show-type" /> Show hiragana/katakana label
        on Japanese → Romaji cards too</label
      >
    </section>

    <section>
      <h2>3. Start</h2>
      <div class="controls">
        <button class="primary" id="sessionStartButton">Start Session</button>
        <label
          ><input type="checkbox" id="difficult-only" /> Practice difficult
          only</label
        >
        <span id="status-msg" role="status"></span>
      </div>
    </section>

    <section id="difficult-section">
      <h2>Difficult Characters</h2>
      <div id="difficult-list"><em>None yet.</em></div>
      <button id="clearDifficultButton">
        Clear All
      </button>
    </section>

    <!-- Fullscreen flashcard overlay -->
    <div id="flashcard-area">
      <div id="progress-row">
        <div id="progress" aria-live="polite"></div>
        <div class="progress-buttons">
          <button id="undoButton" title="Undo last mark (Backspace / Z)" disabled>↶ Undo</button>
          <button id="endSessionButton">End Session</button>
        </div>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="card" role="button" tabindex="0" aria-label="Flashcard">
        <div class="swipe-label swipe-label-left" aria-hidden="true">✗ wrong</div>
        <div class="swipe-label swipe-label-right" aria-hidden="true">✓ correct</div>
        <div id="card-type" hidden></div>
        <div id="card-prompt"></div>
        <div id="card-answer"></div>
        <div id="card-hint"></div>
      </div>
      <div id="card-actions">
        <button id="markWrongButton" class="danger">✗ Wrong</button>
        <button id="markCorrectButton" class="success">✓ Correct</button>
      </div>
      <div id="kbd-hint">
        <kbd>space</kbd>/<kbd>→</kbd> reveal, then correct &nbsp;·&nbsp;
        <kbd>←</kbd>/<kbd>esc</kbd> wrong &nbsp;·&nbsp;
        <kbd>⌫</kbd>/<kbd>z</kbd> undo
      </div>
    </div>

    <!-- Session end modal -->
    <div id="sessionModal">
      <div class="session-modal-box">
        <div id="modalTitle"></div>
        <dl id="modalStats"></dl>
        <div class="modal-buttons">
          <button id="modalRetry" hidden></button>
          <button id="modalDone" class="primary">Done</button>
        </div>
        <button id="modalClose" aria-label="Close">&times;</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
